# =============================================================================
# Nginx server block - Reservation System Roemah Umara
#
# Pasang di server:
#   sudo cp deploy/nginx/roemahumara.conf /etc/nginx/sites-available/roemahumara
#   sudo ln -s /etc/nginx/sites-available/roemahumara /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# CATATAN SSL: blok ini ditulis untuk kondisi SEBELUM Certbot dijalankan (HTTP :80).
# Setelah `sudo certbot --nginx -d domain -d www.domain`, Certbot akan
# menambahkan sendiri blok :443 + redirect. Jangan tulis manual blok SSL di sini
# supaya tidak bentrok dengan yang digenerate Certbot.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # Sekarang alamat IP privat; ganti ke domain saat HTTPS disiapkan (bagian 8
    # RUNBOOK). server_name yang tidak cocok membuat Nginx jatuh ke server block
    # bawaan dan menampilkan halaman "Welcome to nginx" — bukan galat, jadi
    # gejalanya terlihat seperti aplikasinya yang tidak terpasang.
    server_name 192.168.88.33;

    root /var/www/roemahumara/public;
    index index.php;

    charset utf-8;

    # --- Security headers ----------------------------------------------------
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection           "0"                 always;
    server_tokens off;

    # Upload: sesuaikan kalau nanti ada fitur upload bukti DP / foto.
    client_max_body_size 20M;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # --- Routing utama Laravel ----------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Aset build Vite: hashed filename, aman di-cache selamanya -----------
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Aset statis lain ----------------------------------------------------
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- PHP-FPM -------------------------------------------------------------
    location ~ \.php$ {
        # Sesuaikan versi kalau server pakai PHP selain 8.3.
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Blokir dotfiles (.env, .git, dsb) -----------------------------------
    # Secara struktur .env berada DI LUAR document root, tapi ini lapisan kedua.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/roemahumara-access.log;
    error_log  /var/log/nginx/roemahumara-error.log warn;
}
